<title>Slime Brawlers</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"><style>html{color-scheme:dark}html,body{margin:0;color:#fff;height:100%;background:#07060f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;left:50%;top:50%;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:inline-size}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
#lobby{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-family:"Press Start 2P",ui-monospace,monospace;color:#fff}
#lobby .card{background:#15122e;border:.5cqw solid #4a4380;box-shadow:0 0 0 .5cqw #0d0b1a;padding:3cqw 4cqw;width:46cqw;text-align:center;font-size:1.5cqw;line-height:1.7}
#lobby .card{max-height:94%;overflow-y:auto;box-sizing:border-box;padding:2cqw 4cqw}#lobby .h{margin-bottom:1cqw}#lobby .or{margin-top:.6cqw}#lobby .ghost{margin-top:.6cqw}
#lobby .h{color:#ffd24a;font-size:2.4cqw;margin-bottom:2cqw}
#lobby button,#lobby select,#lobby input{font:inherit;font-size:1.6cqw;background:#2d2762;color:#fff;border:.35cqw solid #0d0b1a;padding:1cqw 1.4cqw;cursor:pointer;text-transform:uppercase}
#lobby button:hover:not(:disabled){background:#ffd24a;color:#0d0b1a}
#lobby button:disabled{opacity:.4;cursor:default}
#lobby .ghost{background:transparent;color:#9ad8ff;margin-top:1.5cqw;border-color:transparent}
#lobby input{width:10cqw;text-align:center;letter-spacing:.6cqw;cursor:text;background:#0d0b1a}
#lobby .row{display:flex;gap:1cqw;justify-content:center}
#lobby .or{color:#9ad8ff;margin:1.4cqw 0;font-size:1.2cqw}
#lb-code{font-size:6cqw;color:#ffd24a;letter-spacing:1cqw;margin:1cqw 0;text-shadow:.4cqw .4cqw 0 #0d0b1a}
#lobby.nm #lb-menu,#lobby.nm #lb-wait,#lobby.nm #lb-rule,#lobby.nm #lb-srv,#lobby.nm #lb-p2p{display:none!important}#lobby textarea{width:36cqw;font:inherit;font-size:1.1cqw;background:#0d0b1a;color:#fff;border:.35cqw solid #0d0b1a;padding:.8cqw;text-transform:none;resize:none;word-break:break-all}#lb-sv{width:34cqw!important;letter-spacing:0!important;text-transform:none!important;font-size:1.3cqw!important}#lb-nm{width:24cqw!important;letter-spacing:.1cqw!important}
#lb-msg{color:#ff9a9a;min-height:3cqw;margin-top:1.5cqw;font-size:1.2cqw}
#lb-wait{display:none}#lb-rule{margin-top:1.5cqw}
#touch{position:absolute;inset:0;pointer-events:none;font-family:"Press Start 2P",monospace}
#touch .tg{position:absolute;bottom:3cqw;display:flex;gap:1.2cqw;pointer-events:auto;touch-action:none}
#touch .tg.l{left:2cqw}#touch .tg.r{right:2cqw}
#touch b{width:8cqw;height:8cqw;display:flex;align-items:center;justify-content:center;background:#ffffff26;border:.4cqw solid #ffffff60;border-radius:50%;color:#fff;font-size:2.4cqw;touch-action:none}
#touch b.on{background:#ffd24a99}
@media (orientation:portrait){
#wrap{top:env(safe-area-inset-top,0px);transform:translateX(-50%)}
#touch{inset:auto;left:0;top:100%;width:100%;height:calc(100vh - 56.25vw - env(safe-area-inset-top,0px))}
#touch .tg.l{left:3cqw;bottom:calc(6cqw + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,14cqw);gap:1.2cqw}

#touch b{width:14cqw;height:14cqw;font-size:4.6cqw}

}

    f.hs=0; f.bst=0; f.inv=0; f.combo=0; f.onGround=1; f.guard=0; f.airUsed=0; f.dj=0; f.dmgTaken=0; f.slow=0; f.burn=0; f.burnT=0; f.pct=0; f.pin=0; }
  G.proj.length=0; G.phase=P_INTRO; G.t=0; G.timer=R.timer; G.hitstop=0; G.roundWinner=-1; G.comboT[0]=G.comboT[1]=0;
}
function setSt(f,s){ f.st=s; f.stT=0; }
function ev(G,o){ G.ev.push(o); }
function gainMeter(f,v){ f.meter=Math.min(100,f.meter+v*(CH[f.ch].meterMul||1)); }

// ---- moves ---------------------------------------------------------
function startMove(G,i,key){
  const f=G.f[i], C=CH[f.ch], m=C.mv[key];
  if(key==='sp'){ f.meter-=spCost(f.ch); f.spUsed++; ev(G,{t:'special',i:i,x:f.x,y:f.y-20,ch:f.ch}); }
  f.st=S_ATK; f.stT=0; f.mv=key; f.moveT=0; f.moveHit=0; if(f.onGround && !m.mx) f.vx=0;
}
function moveFrames(m){ return m.su+m.ac+m.rc; }

function stepFighter(G,i){
  const f=G.f[i], o=G.f[1-i], C=CH[f.ch], R=G.rules;
  let m=G.inp[i]; if(G.phase!==P_FIGHT) m=0;
  const pr=f.pin; f.pin=m; const pressed=m&~pr;
  f.stT++; if(f.inv>0) f.inv--; if(f.slow>0) f.slow--;
  if(C.regen&&G.phase===P_FIGHT&&!R.sumo&&f.hp>0&&f.hp<f.hpMax&&G.frame%C.regen===0&&f.st!==S_FALL&&f.st!==S_KO) f.hp++;
  if(f.burn>0&&G.phase===P_FIGHT){ if(--f.burnT<=0){ f.burnT=24; f.burn--; if(R.sumo) f.pct+=1; else if(f.hp>1) f.hp--; ev(G,{t:'burn',x:f.x,y:f.y-20}); } }
  const spd=f.slow>0?.55:1;
  const dir=((m&IR)?1:0)-((m&IL)?1:0);
  const free=(f.st===S_IDLE||f.st===S_WALK||f.st===S_BLOCK);
  if(free&&f.onGround&&f.bst<=0) f.face=(o.x>=f.x)?1:-1;
  if(f.bst>0&&f.st===S_BLOCK){ f.bst--; if(f.bst<=0&&!(m&ID)) setSt(f,S_IDLE); }
  switch(f.st){
    case S_IDLE: case S_WALK: case S_BLOCK:{
      if(f.st===S_BLOCK&&f.bst>0){ f.vx*=.8; break; }
      if(pressed&IC && f.meter>=spCost(f.ch) && G.phase===P_FIGHT){ startMove(G,i,'sp'); break; }
      if(pressed&IB){ startMove(G,i,'hv'); break; }
      if(pressed&IA){ startMove(G,i,'lt'); break; }
      if(pressed&IU && f.onGround){ f.vy=C.jump*(f.slow>0?.88:1); f.vx=dir*C.walk*spd; f.onGround=0; f.airUsed=0; f.dj=0; setSt(f,S_JUMP); ev(G,{t:'jump',x:f.x,y:f.y}); break; }
      if(m&ID){ f.st=S_BLOCK; f.vx=0; break; }
      f.vx=dir*(dir===f.face?C.walk:C.back)*spd;
      if(dir){ if(f.st!==S_WALK) setSt(f,S_WALK); } else if(f.st!==S_IDLE) setSt(f,S_IDLE);
      break; }
    case S_JUMP:{
      f.vx+=(dir*C.walk*spd-f.vx)*.06;
      if(C.dj && !f.dj && (pressed&IU)){ f.dj=1; f.vy=C.jump*.9; f.vx=dir*C.walk; ev(G,{t:'jump',x:f.x,y:f.y,air:1}); }
      else if(!f.airUsed && (pressed&(IA|IB))){ f.airUsed=1; startMove(G,i,'aa'); }
      break; }
    case S_ATK:{
      const mv=C.mv[f.mv], t=f.moveT;
      if(mv.jump && t===mv.jump[0]){ f.vy=mv.jump[2]; f.vx=f.face*mv.jump[1]; f.onGround=0; }
      if(mv.mx){ if(t>=mv.mx[0]&&t<mv.mx[1]) f.vx=f.face*mv.mx[2]; else if(t===mv.mx[1]) f.vx*=.2; }
      if(mv.tp!=null && t===mv.tp){ const side=(f.x<=o.x)?1:-1; let nx=o.x+side*(CH[o.ch].hw+16); nx=Math.max(WALL,Math.min(W-WALL,nx));
        ev(G,{t:'blink',x:f.x,y:f.y-16,x2:nx,ch:f.ch}); f.x=nx; f.face=(o.x>=f.x)?1:-1; f.vx=0; }
      { const sps=mv.spawns||(mv.spawn?[mv.spawn]:[]); for(const sp of sps){ if(t===sp[0]){ const p=sp[1];
        G.proj.push({own:i,kind:p.kind,x:p.atFoe?o.x:f.x+f.face*p.dx,y:p.atFoe?GY+p.dy:f.y+p.dy,vx:f.face*p.vx,w:p.w,h:p.h,dmg:p.dmg,life:p.life,kb:p.kb,hs:p.hs,bs:p.bs,launch:p.launch,face:f.face,age:0,slow:p.slow||0,stun:p.stun||0,hstop:p.hs>0?6:4,spark:1,delay:p.delay||0,ret:p.ret||0,back:0}); } } }
      if(mv.inv && t>=mv.inv[0] && t<mv.inv[1]) f.inv=Math.max(f.inv,1);
      f.moveT++;
      // cancel into a stronger move once it has connected
      if(f.moveHit && f.moveT>=mv.su+1 && !mv.air && G.phase===P_FIGHT){
        if(f.mv==='lt' && (pressed&IB)){ startMove(G,i,'hv'); break; }
        if((f.mv==='lt'||f.mv==='hv') && (pressed&IC) && f.meter>=spCost(f.ch)){ startMove(G,i,'sp'); break; }
        if(f.mv==='lt' && (pressed&IA) && f.moveT>=mv.su+mv.ac){ startMove(G,i,'lt'); break; }
      }
      if(f.moveT>=moveFrames(mv)||(mv.air&&f.onGround)){ if(f.onGround) setSt(f,S_IDLE); else setSt(f,S_JUMP); f.mv=''; }
      break; }
    case S_HIT:{ f.hs--; f.vx*=.9; if(f.hs<=0){ setSt(f,S_IDLE); f.combo=0; } break; }
    case S_STUN:{ f.hs--; f.vx*=.85; if(f.hs<=0){ setSt(f,S_IDLE); f.guard=0; } break; }
    case S_FALL:{ f.inv=Math.max(f.inv,1); break; }
    case S_DOWN:{ f.vx*=(G.rules.sumo?.93:.85); f.inv=Math.max(f.inv,1); if(f.stT>=34){ setSt(f,S_GETUP); } break; }
    case S_GETUP:{ f.inv=Math.max(f.inv,1); if(f.stT>=14){ setSt(f,S_IDLE); f.combo=0; } break; }
    case S_KO:{ f.vx*=.94; break; }
    case S_WIN:{ f.vx=0; break; }
  }
  // guard decay
  if(f.st!==S_BLOCK && f.guard>0) f.guard-=.18*(C.gr||1); if(f.guard<0) f.guard=0;
  // physics
  const py=f.y;
  f.x+=f.vx;
  if(f.x<WALL){ f.x=WALL; if(f.vx<0) f.vx=0; } if(f.x>W-WALL){ f.x=W-WALL; if(f.vx>0) f.vx=0; }
  if(G.ring&&f.pct<45&&f.st!==S_KO){ if(f.x<G.ring[0]){ f.x=G.ring[0]; if(f.vx<0) f.vx=0; } else if(f.x>G.ring[1]){ f.x=G.ring[1]; if(f.vx>0) f.vx=0; } }
  const plat=!G.ring||(f.x>=G.ring[0]&&f.x<=G.ring[1]);
  if(f.onGround&&!plat){ f.onGround=0; f.vy=0; if(f.st!==S_ATK&&f.st!==S_FALL&&f.st!==S_KO) setSt(f,S_JUMP); }
  if(!f.onGround){ f.vy+=((f.st===S_FALL||f.st===S_DOWN)?1.6:0.42); f.y+=f.vy; }
  if(f.y>=GY && plat && py<=GY+1){
    f.y=GY;
    if(!f.onGround){
      f.onGround=1; f.dj=0;
      if(f.st===S_FALL){ f.vx*=G.rules.sumo?1:.6; f.vy=0; if(f.hp<=0&&!G.rules.sumo){ setSt(f,S_KO); } else { setSt(f,S_DOWN); } ev(G,{t:'land',x:f.x,y:GY,big:1}); G.shake=Math.max(G.shake,6); }
      else if(f.st===S_KO){ f.vy=0; ev(G,{t:'land',x:f.x,y:GY,big:1}); }
      else if(f.st===S_JUMP||f.st===S_ATK){ f.vy=0; if(f.st===S_JUMP){ setSt(f,S_IDLE); f.vx=0; } ev(G,{t:'land',x:f.x,y:GY,big:0}); }
      else { f.vy=0; }
    } else if(f.st===S_KO||f.st===S_DOWN){ f.vy=0; }
  }
}

function hurtbox(f){ const C=CH[f.ch], hw=C.hw, lying=(f.st===S_DOWN||f.st===S_KO); return lying?[f.x-24,f.y-12,f.x+24,f.y]:[f.x-hw,f.y-C.hh,f.x+hw,f.y]; }
function hitbox(f,mv){ const b=mv.box, a=f.face===1?[f.x+b[0],f.x+b[2]]:[f.x-b[2],f.x-b[0]]; return [a[0],f.y+b[1],a[1],f.y+b[3]]; }
function ovl(a,b){ return a[0]<b[2]&&a[2]>b[0]&&a[1]<b[3]&&a[3]>b[1]; }

function doKO(G,ai,di,ring){
  const a=G.f[ai], d=G.f[di];
  G.phase=P_KO; G.t=0; G.roundWinner=ai; a.wins++; G.shake=10; G.hitstop=ring?0:14;
  if(!ring){ d.hp=0; d.st=S_FALL; d.vy=-7.5; d.vx=(d.x>=a.x?1:-1)*4.5; d.onGround=0; }
  if(a.dmgTaken===0) a.perfects++;
  ev(G,{t:'ko',x:d.x,y:Math.min(d.y-20,H-30),di:di,ring:ring?1:0});
}

// resolve one hit (melee or projectile); returns true if it connected (hit or block)
function resolveHit(G,ai,di,mv,hx,hy,isProj){
  const a=G.f[ai], d=G.f[di], R=G.rules, AC=CH[a.ch], DC=CH[d.ch];
  if(d.inv>0||d.st===S_KO||d.st===S_DOWN||d.st===S_GETUP||d.st===S_FALL||G.phase!==P_FIGHT) return false;
  const blocking=(d.st===S_BLOCK) && d.onGround;
  const face=isProj?mv.face:a.face;
  if(blocking){
    const chip=Math.max(1,Math.round(mv.dmg*.14));
    if(R.sumo) d.pct+=chip; else d.hp=Math.max(1,d.hp-chip);
    d.bst=mv.bs; d.vx=face*(mv.kb[0]*.9+.8); d.guard+=mv.dmg*3.2+4; d.blocks++;
    if(!isProj) a.vx=-face*.9;
    gainMeter(a,2); gainMeter(d,3);
    G.hitstop=Math.max(G.hitstop,Math.min(5,mv.hstop)); ev(G,{t:'block',x:hx,y:hy,di:di,face:face});
    if(d.guard>=GUARD_MAX){ d.guard=0; d.st=S_STUN; d.stT=0; d.hs=50; d.bst=0; d.vx=face*3; ev(G,{t:'gbreak',x:d.x,y:d.y-30,di:di}); G.hitstop=Math.max(G.hitstop,10); }
    return true;
  }
  // clean hit
  d.combo++; if(d.combo>a.maxCombo) a.maxCombo=d.combo;
  const scale=Math.max(.5,1-.1*(d.combo-1));
  let dmg=Math.max(1,Math.round(mv.dmg*scale*(DC.dmgMul||1)*(AC.atkMul||1)*(R.atk[ai]||1)*((AC.rage&&a.hp<30)?AC.rage:1)));
  let kill=false;
  if(R.sumo){ d.pct+=dmg; }
  else { d.hp-=dmg; if(d.hp<=0){ if(R.train){ d.hp=d.hpMax; } else kill=true; } }
  d.dmgTaken+=dmg; gainMeter(a,dmg*1.1+3); gainMeter(d,dmg*.6);
  if(AC.drain&&!R.sumo){ const h=Math.round(dmg*AC.drain); a.hp=Math.min(a.hpMax,a.hp+h); a.drained+=h; }
  if(AC.burn) { d.burn=3; d.burnT=24; }
  if(mv.slow) d.slow=mv.slow;
  G.comboShow[ai]=d.combo; G.comboT[ai]=90; a.hits++;
  d.guard=0; d.bst=0; d.mv='';
  const mult=R.sumo?(1+Math.max(d.pct,d.pct>=45?90:0)/45)*(AC.kbMul||1):1;
  const launch=!mv.stun&&(mv.launch||kill||!d.onGround||(R.sumo&&d.pct>=45));
  d.stT=0; d.hs=mv.hs;
  if(mv.stun&&!kill){ d.st=S_STUN; d.hs=mv.stun; d.vx=face*1.2; d.onGround=d.onGround; }
  else if(launch){ d.vy=-1.2; d.onGround=0; d.st=S_FALL; d.vx=face*Math.max(2,Math.abs(mv.kb[0]))*mult; }
  else { d.st=S_HIT; d.vx=face*mv.kb[0]*mult; }
  G.hitstop=Math.max(G.hitstop,mv.hstop); G.shake=Math.max(G.shake,(mv.spark||0)+(launch?2:0)+1);
  ev(G,{t:'hit',x:hx,y:hy,k:mv.spark||0,di:di,dmg:dmg,face:face,launch:launch?1:0,stun:mv.stun?1:0,burn:AC.burn?1:0,ch:a.ch});
  if(kill) doKO(G,ai,di,false);
  return true;
}

function stepProj(G){
  for(let k=G.proj.length-1;k>=0;k--){
    const p=G.proj[k]; p.age++; p.x+=p.vx; p.life--;
    if(p.vy!=null){ p.y+=p.vy; if(p.g) p.vy+=p.g; if(p.y>GY-8){ p.y=GY-8; p.vy=-(p.vy*(p.bounce||0.6)); } }
    if(p.ret&&!p.back&&p.age>=p.ret){ p.back=1; p.vx=-p.vx; }
    const di=1-p.own, d=G.f[di];
    if(p.age>=p.delay){
      const box=[p.x-p.w/2,p.y-p.h/2,p.x+p.w/2,p.y+p.h/2];
      if(ovl(box,hurtbox(d))){ if(resolveHit(G,p.own,di,p,p.x,p.kind==='pillar'?d.y-14:p.y,true)){
        if(p.ret&&!p.back){ p.back=1; p.vx=-p.vx; p.age=Math.max(p.age,p.ret); p.life=Math.max(p.life,24); continue; }
        G.proj.splice(k,1); continue; } }
    }
    if(p.life<=0||p.x<-20||p.x>W+20) G.proj.splice(k,1);
  }
}

function pushApart(G){
  const a=G.f[0], b=G.f[1];
  const ghost=(f)=>(f.st===S_ATK&&CH[f.ch].mv[f.mv].pass)||f.st===S_FALL||f.st===S_DOWN||f.st===S_KO;
  if(ghost(a)||ghost(b)) return;
  const dy=Math.abs(a.y-b.y); if(dy>30) return;
  const min=CH[a.ch].hw+CH[b.ch].hw, dx=b.x-a.x, ad=Math.abs(dx);
  if(ad<min){ const push=(min-ad)/2, s=dx>=0?1:-1;
    a.x-=s*push; b.x+=s*push;
    if(a.x<WALL){ b.x+=WALL-a.x; a.x=WALL; } if(a.x>W-WALL){ b.x-=a.x-(W-WALL); a.x=W-WALL; }
    if(b.x<WALL){ a.x+=WALL-b.x; b.x=WALL; } if(b.x>W-WALL){ a.x-=b.x-(W-WALL); b.x=W-WALL; } }
}

function simStep(G,in0,in1){
  const R=G.rules;
  G.inp[0]=in0; G.inp[1]=in1; G.frame++; G.ev.length=0;
  if(G.shake>0) G.shake-=.5;
  for(let k=0;k<2;k++){ if(G.comboT[k]>0) G.comboT[k]--; }
  if(G.hitstop>0){ G.hitstop--; return; }
  G.t++;
  if(G.phase===P_INTRO){ if(G.t>=INTRO_FRAMES){ G.phase=P_FIGHT; G.t=0; ev(G,{t:'fight'}); } }
  const hit=[];
  stepFighter(G,0); stepFighter(G,1);
  pushApart(G); if(G.ring) for(const q of G.f){ if(q.pct<45&&q.st!==S_KO){ if(q.x<G.ring[0]) q.x=G.ring[0]; else if(q.x>G.ring[1]) q.x=G.ring[1]; } }
  if(R.train||R.frenzy){ const mr=R.train?.6:.3; for(const f of G.f){ if(f.meter<100) f.meter=Math.min(100,f.meter+mr); } }
  // melee hits (collect first so simultaneous trades work)
  if(G.phase===P_FIGHT||G.phase===P_INTRO){
    for(let i=0;i<2;i++){ const a=G.f[i]; if(a.st!==S_ATK) continue; const mv=CH[a.ch].mv[a.mv];
      if(mv.noBox||a.moveHit) continue; const t=a.moveT-1; if(t<mv.su||t>=mv.su+mv.ac) continue;
      const hb=hitbox(a,mv), d=G.f[1-i], hh=CH[d.ch].hh;
      if(ovl(hb,hurtbox(d))) hit.push([i,mv,(Math.max(hb[0],d.x-12)+Math.min(hb[2],d.x+12))/2,(Math.max(hb[1],d.y-hh)+Math.min(hb[3],d.y))/2]); }
    for(const h of hit){ const a=G.f[h[0]]; if(resolveHit(G,h[0],1-h[0],h[1],h[2],h[3],false)) a.moveHit=1; }
  }
  stepProj(G);
  // ring-out (sumo)
  if(R.sumo&&G.phase===P_FIGHT){ for(let i=0;i<2;i++){ if(G.f[i].y>H+34){ doKO(G,1-i,i,true); break; } } }
  // round flow
  if(G.phase===P_FIGHT){
    if(R.timer>0){ G.timer--;
      if(G.timer<=0){ const a=G.f[0], b=G.f[1];
        const sa=R.sumo?-a.pct:a.hp, sb=R.sumo?-b.pct:b.hp;
        if(sa===sb){ G.phase=P_OVER; G.t=0; G.roundWinner=-1; G.draws++; ev(G,{t:'timeup',w:-1}); }
        else { const w=sa>sb?0:1; G.roundWinner=w; G.f[w].wins++; if(G.f[w].dmgTaken===0) G.f[w].perfects++; G.phase=P_OVER; G.t=0; ev(G,{t:'timeup',w:w}); }
      } }
  } else if(G.phase===P_KO){
    if(G.t>=(G.f[0].y>H||G.f[1].y>H?100:130)){ G.phase=P_OVER; G.t=0; }
  } else if(G.phase===P_OVER){
    const w=G.roundWinner;
    if(G.t===20&&w>=0){ const wf=G.f[w]; if(wf.st!==S_WIN&&wf.onGround){ setSt(wf,S_WIN); wf.vx=0; } }
    if(G.t>=110){
      if(G.f[0].wins>=R.wins||G.f[1].wins>=R.wins){ G.phase=P_MATCH; G.t=0; G.winner=G.f[0].wins>=R.wins?0:1; ev(G,{t:'match',w:G.winner}); }
      else { G.round++; resetRound(G); }
    }
  }
}

function simHash(G){
  let h=(G.frame*2654435761)>>>0;
  const mix=(v)=>{ h=(Math.imul(h^(Math.round(v*16)|0),16777619))>>>0; };
  for(const f of G.f){ mix(f.x);mix(f.y);mix(f.vx);mix(f.vy);mix(f.hp);mix(f.meter);mix(f.st);mix(f.stT);mix(f.moveT);mix(f.guard);mix(f.face);mix(f.pct);mix(f.slow);mix(f.burn); }
  mix(G.proj.length); for(const p of G.proj){ mix(p.x); mix(p.y); }
  mix(G.phase); mix(G.timer); mix(G.round);
  return h>>>0;
}

// ---- CPU opponent (local only, may use Math.random) ----------------------
function botInput(G,i,level,mem){
  const f=G.f[i], o=G.f[1-i]; let m=0;
  if(G.phase!==P_FIGHT) return 0;
  if(mem.cool>0) mem.cool--;
  const dx=o.x-f.x, ad=Math.abs(dx), toward=dx>0?IR:IL, away=dx>0?IL:IR;
  const skill=[.35,.62,.9][level];
  if(level===0){ if(G.round<=1) return 0; if(ad<46&&mem.cool<=0&&Math.random()<.1){ mem.cool=14; return Math.random()<.65?IA:IB; } return 0; } // easy CPU: round 1 is a pure dummy (no moving, blocking or attacking); later rounds it stands still and only swings when you are right next to it
  // never wander off the sumo ring
  if(G.ring){ if(f.x<G.ring[0]+22&&f.onGround) { if(Math.random()<.5) return IR; } if(f.x>G.ring[1]-22&&f.onGround){ if(Math.random()<.5) return IL; } }
  const danger=o.st===S_ATK&&ad<110;
  if(mem.hold>0){ mem.hold--; return mem.m|0; }
  if(f.st===S_JUMP&&CH[f.ch].dj&&!f.dj&&G.ring&&(f.y>GY+6||f.x<G.ring[0]||f.x>G.ring[1])){ return IU|(f.x<240?IR:IL); }
  if(level>0 && danger && Math.random()<skill*0.8 && f.onGround && f.st!==S_ATK){ mem.m=ID; mem.hold=8+((Math.random()*10)|0); return ID; }
  for(const p of G.proj){ if(p.own!==i && Math.abs(p.x-f.x)<120 && f.onGround && Math.random()<skill*.5){ mem.m=IU; mem.hold=2; return IU; } }
  if(f.meter>=spCost(f.ch) && mem.cool<=0 && Math.random()<.04*(level+1)){
    const ch=CH[f.ch].id; if((ch==='gloop'&&ad>80)||(ch==='frost'&&ad>100)||(ch==='volt'&&ad>100)||(ch==='ember'&&ad>55&&ad<150)||(ch==='rocky'&&ad<80)||(ch==='void'&&ad<200)||(ch==='ruby'&&ad>50)||(ch==='hatter'&&ad>70)||(ch==='twin'&&ad>90)||(ch==='god'&&ad>40)){ mem.cool=40; return IC; } }

function blob(x,y,hw,hh,sx,sy,skew,face,pal,o){
  o=o||{};

  if(shape!=='dome') skew*=.62;

    if(shape==='cube'){ const m=Math.min(r,H2-1-r); let inset=0; if(m<rad){ const dy=rad-m-.5; inset=rad-Math.sqrt(Math.max(0,rad*rad-dy*dy)); } half=Math.max(1,Math.round(HW-inset)); }

  ctx.fillStyle=OUTC;
  for(let r=0;r<H2;r++){ const [a,w]=X(rows[r][0]-1,rows[r][1]+1); ctx.fillRect(a,top+r,w,1); }
  { const [a,w]=X(rows[0][0],rows[0][1]); ctx.fillRect(a,top-1,w,1); } { const [a,w]=X(rows[H2-1][0],rows[H2-1][1]); ctx.fillRect(a,top+H2,w,1); }
  const fl=o.flash, body=fl?'#ffffff':pal.body, dark=fl?'#d8d8f0':pal.dark, light=fl?'#ffffff':pal.light;
  const split=!!pal.body2, body2=fl?'#ffffff':pal.body2, dark2=fl?'#d8d8f0':pal.dark2, light2=fl?'#ffffff':pal.light2;
  const fillRow=(a,w,yy,c1,c2)=>{ if(!split){ ctx.fillStyle=c1; ctx.fillRect(a,yy,w,1); return; }

    else if(v>.3){ const rw=Math.max(2,Math.round(w*.14)); const rx=face>0?a+w-rw:a; const rightSide=(rx+rw/2)>=Math.round(x); ctx.fillStyle=(split&&rightSide)?light2:dark; ctx.fillRect(rx,top+r,rw,1); }
  }
  if(H2>10){ const [a,w]=X(rows[Math.round(H2*.2)][0],rows[Math.round(H2*.2)][1]);
    ctx.fillStyle=light; const hx=face>0?a+Math.round(w*.2):a+w-Math.round(w*.2)-4;
    const hxL=split?Math.min(hx,Math.round(x)-6):hx;

    ctx.fillRect(hxL+(face>0||split?5:-3),top+Math.round(H2*.2)+1,1,1);
    const [b2,w2]=X(rows[1][0],rows[1][1]); ctx.fillStyle=light; ctx.fillRect(b2+Math.round(w2*.3),top+1,Math.round(w2*.4),1); }

  return {top:top,H2:H2,cx:Math.round(x)+Math.round(mc(Math.round(H2*.34)))*face,cxTop:Math.round(x)+Math.round(mc(1))*face,rows:rows};
}

function slimeAnim(f,C,now,rs){
  const P={sx:1,sy:1,skew:0,oy:0,eyes:'n',mouth:'n',pod:null,alpha:1,block:0,blinkOut:0};
  const t=f.stT, fc=f.face;
  const sqT=rs.sq>0?rs.sq:0;
  switch(f.st){
    case S_IDLE:{ const b=Math.sin(now/230+rs.seed); P.sy=1+b*.05; P.sx=1-b*.04; break; }
    case S_WALK:{ const ph=t*.3, h=Math.abs(Math.sin(ph)); P.sy=.88+h*.22; P.sx=1.1-h*.14; P.oy=-h*4; P.skew=Math.sign(f.vx)*3; break; }
    case S_JUMP:{ if(f.vy<-3){ P.sy=1.22; P.sx=.84; } else if(f.vy<2){ P.sy=1.04; P.sx=.98; } else { P.sy=1.14; P.sx=.9; } P.skew=f.vx*1.2; P.eyes='w'; break; }
    case S_BLOCK:{ P.sy=.8; P.sx=1.2; P.block=1; P.eyes='b'; break; }
    case S_ATK:{ const mv=C.mv[f.mv], tt=f.moveT, su=mv.su, ac=mv.ac, rc=mv.rc; P.eyes='a'; P.mouth='o';
      if(tt<su){ const p=tt/su; P.sx=1+.16*p; P.sy=1-.18*p; P.skew=-4*p; }
      else if(tt<su+ac){ P.sx=1.18; P.sy=.9; P.skew=7; }
      else { const w=(tt-su-ac)/Math.max(1,rc); P.sx=1+.12*Math.sin(w*16)*(1-w); P.sy=1-.1*Math.sin(w*16)*(1-w); P.skew=3*(1-w); P.mouth='n'; }
      if(mv.air&&!f.onGround){ P.skew=9; P.sy=1.1; P.sx=.95; }
      if(mv.mx&&tt>=mv.mx[0]&&tt<=mv.mx[1]){ P.sx=1.55; P.sy=.78; P.skew=9; }
      if(mv.tp!=null){ P.alpha=tt<mv.tp?Math.max(.1,1-tt/(mv.tp+1)):(tt<mv.tp+4?.5+((tt-mv.tp)/8):1); if(tt<mv.tp){ P.sx=1-tt*.25; } }
      if(!mv.beam&&(f.mv!=='sp'||mv.box[2]>0)){ // pseudopod for melee moves
        const on=tt>=su-1&&tt<su+ac+rc*.55; if(on&&!mv.noBox){ let ext=Math.min(1,(tt-su+3)/3); if(tt>=su+ac) ext=Math.max(0,1-(tt-su-ac)/(rc*.55)); const b=mv.box; P.pod={bx:b[2],by:(b[1]+b[3])/2,ext:ext,th:f.mv==='hv'?13:(f.mv==='sp'?14:9)}; } }
      else if(mv.noBox){ const sp0=(mv.spawns&&mv.spawns[0]||mv.spawn)[0]; if(tt>=sp0-3&&tt<sp0+6){ P.sx=1.2; P.skew=5; } } // spit
      break; }
    case S_HIT:{ P.sx=.82+Math.sin(t*1.2)*.04; P.sy=1.2; P.skew=-6; P.eyes='x'; P.mouth='s'; break; }
    case S_STUN:{ const w=Math.sin(t*.45); P.sx=1+w*.1; P.sy=1-w*.1; P.skew=w*4; P.eyes='d'; P.mouth='s'; break; }
    case S_FALL:{ P.sy=1.18; P.sx=.86; P.skew=-Math.sign(f.vx)*6; P.eyes='x'; P.mouth='s'; break; }
    case S_DOWN:{ const k=Math.min(1,t/6); P.sx=1+.5*k; P.sy=1-.6*k+.05*Math.sin(t*.4); P.eyes='x'; P.mouth='s'; break; }
    case S_GETUP:{ const k=Math.min(1,t/14), e=k*k*(3-2*k); P.sx=1.5+(-.5)*e; P.sy=.4+.6*e+Math.sin(k*3.14)*.15; P.eyes='n'; break; }

    case S_WIN:{ const h=Math.abs(Math.sin(t/8)); P.oy=-h*12; P.sy=1+(h>.7?.2:-.06*(1-h)); P.sx=1-(h>.7?.12:-.08*(1-h)); P.eyes='h'; P.mouth='h'; break; }
  }
  if(sqT>0 && (f.st===S_IDLE||f.st===S_WALK)){ const k=sqT/8; P.sy*=1-.32*k; P.sx*=1+.3*k; }
  return P;
}

let PT=[];
function rnd(a,b){ return a+Math.random()*(b-a); }
function P_(o){ PT.push(Object.assign({t:0,life:30,vx:0,vy:0,g:0,s:2,c:'#fff',kind:'sq',fr:1},o)); }
function updatePT(){ for(let i=PT.length-1;i>=0;i--){ const p=PT[i]; p.t++; p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=p.fr; if(p.t>=p.life) PT.splice(i,1); } }

    if(p.kind==='sq'){ ctx.globalAlpha=k>.7?1-(k-.7)/.3:1; const s=Math.max(1,Math.round(p.s*(p.shrink?1-k:1))); R_(p.x-s/2,p.y-s/2,s,s,p.c); ctx.globalAlpha=1; }

    else if(p.kind==='txt'){ ctx.globalAlpha=k>.6?1-(k-.6)/.4:1; txt(p.str,p.x,p.y,p.c,p.sc||1,1,OUT); ctx.globalAlpha=1; }
    else if(p.kind==='flame'){ const s=Math.round(p.s*(1-k)); ctx.globalAlpha=1-k*.5; R_(p.x-s/2,p.y-s,s,s,k<.4?'#ffe45a':'#ff6a3a'); ctx.globalAlpha=1; }
    else if(p.kind==='bolt'){ ctx.globalAlpha=1-k; let x=p.x,y=p.y; for(let i=0;i<6;i++){ const nx=x+((i%2)?5:-5)*p.dir, ny=y+7; R_(Math.min(x,nx),y,Math.abs(nx-x)+2,2,p.c); R_(nx,y,2,8,p.c); x=nx; y=ny; } ctx.globalAlpha=1; }
  }
}
function burst(x,y,col,n,sp,g){ for(let i=0;i<n;i++){ const a=Math.random()*6.283, s=rnd(.6,1)*sp; P_({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.8,g:g==null?.22:g,s:rnd(2,4),c:col,life:rnd(18,34),shrink:1}); } }

function buildLadder(ci){
  const others=[]; for(let i=0;i<CH.length;i++) if(i!==ci) others.push(i);
  // deterministic-ish shuffle
  for(let i=others.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=others[i]; others[i]=others[j]; others[j]=t; }
  const L=[]; const lv=[0,0,1,1,2];
  others.slice(0,5).forEach((o,i)=>L.push({ci:o,sk:0,lvl:lv[i],stage:i%3,rules:{}}));
  const boss=ci===CHI.god?CHI.void:CHI.god; L.push({ci:boss,sk:1%(SKINS[CH[boss].id].length),lvl:2,stage:2,rules:{hpMax:[100,150],atk:[1,1.15]},boss:1});
  return L; }
function startArcade(){ run=newRun('arcade'); run.ladder=buildLadder(sel[0].ci); run.idx=0; run.cont=2; sel[1].ci=run.ladder[0].ci; ladderT=0; setScene('ladder'); }

  const maskAt=(g,x,y)=>{ for(const el of g.querySelectorAll('[data-m]')){ const r=el.getBoundingClientRect(); const pad=r.width*.12; if(x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad) return +el.getAttribute('data-m'); } return 0; };

    g.addEventListener('pointermove',e=>{ if(e.pointerId in ptr){ e.preventDefault(); setP(e,g); } });

    const mi=rows.findIndex(r=>r.id===LB.uid); txt(mi>=0?'YOU: #'+(mi+1)+'   BEST '+rows[mi].best:'YOU: NOT IN THE TOP 100',16,H-14,'#ffd24a',1,0);
    txt('UP/DOWN SCROLL  A REFRESH',W-16,H-14,'#6a64a8',1,2);
    hot(W-50,30,50,100,()=>{ if(lbScroll>0) lbScroll--; }); hot(W-50,130,50,100,()=>{ if(lbScroll<rows.length-9) lbScroll++; }); }
  
  if(LB.state==='ready'&&LB.canWrite===false) txt('VIEW ONLY: YOU CANT POST SCORES',16,H-26,'#ff9a9a',1,0);
  if(!rows||!rows.length) txt('ESC = BACK',W/2,H-14,'#6a64a8',1,1); }


// ---- own-server backend (no Claude needed): rooms over SSE, leaderboard over HTTP -----------------------
const SBS={base:'',ok:false,p:null};
function sbProbe(){ return SBS.p||(SBS.p=(async()=>{ SBS.base=String(window.SB_SERVER||SAVE.server||'').replace(/\/$/,''); if(!SBS.base&&(location.protocol==='file:'||window.claude)) return false; try{ const c=new AbortController(), t=setTimeout(()=>c.abort(),2500); const r=await fetch(SBS.base+'/api/ping',{signal:c.signal,cache:'no-store'}); clearTimeout(t); const j=await r.json(); SBS.ok=!!(j&&j.ok); }catch(e){ SBS.ok=false; } return SBS.ok; })()); }
function sbPost(path,body){ return fetch(SBS.base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),keepalive:true}).then(r=>r.json()).catch(()=>null); }
function sbRoom(){ return { join:async name=>{
  const me=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); let list=[],mine={},pend=null,timer=0,closed=0,opened=0;
  const path='/api/room/'+encodeURIComponent(name);
  const flush=()=>{ timer=0; if(!pend||closed) return; const b=pend; pend=null; sbPost(path+'/presence',{peer:me,patch:b}); };
  const es=new EventSource(SBS.base+path+'/events?peer='+me);
  es.onmessage=ev=>{ try{ list=JSON.parse(ev.data); }catch(e){} };
  await new Promise((res,rej)=>{ const to=setTimeout(()=>{ try{ es.close(); }catch(e){} rej({code:'timeout'}); },5000);
    es.onopen=()=>{ clearTimeout(to); if(opened){ pend=Object.assign({},mine); if(!timer) timer=setTimeout(flush,30); } else { opened=1; res(); } };
    es.onerror=()=>{ if(es.readyState===2){ clearTimeout(to); rej({code:'server'}); } }; });
  return {
    presence:async patch=>{ Object.assign(mine,patch); pend=Object.assign(pend||{},patch); if(!timer) timer=setTimeout(flush,30); },
    peers:()=>{ const out=list.map(p=>({peer:p.peer,isMe:p.peer===me,sameTab:p.peer===me,kind:'viewer',guest:false,by:null,presence:p.peer===me?Object.assign({},p.presence,mine):(p.presence||{})}));
      if(!out.some(p=>p.isMe)) out.push({peer:me,isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:Object.assign({},mine)}); return out; },
    leave:()=>{ closed=1; try{ es.close(); }catch(e){} sbPost(path+'/leave',{peer:me}); } }; } }; }
async function lbRename(n){  n=lbClean(n); if(n.length<2) return 'NAME TOO SHORT'; const old=SAVE.name; SAVE.name=n; SAVE.nameAuto=0; save();
  await lbInit();
  if(LB.mode==='server'){ const r=await sbPost('/api/lb',{pid:SAVE.pid,name:n}); if(!r||!r.ok){ SAVE.name=old; save(); return (r&&r.err)||'COULD NOT SAVE NAME'; } }
  LB.sent=''; lbSubmit(); return ''; }
function lobbyTitle(t){ const h=document.querySelector('#lobby .h'); if(h) h.textContent=t; }
function openNameEditor(){ const el=$('lobby'); if(!el) return; el.classList.add('nm'); lobbyTitle('CHANGE NAME'); $('lb-nm').value=SAVE.name||''; net.err=''; lobbyShow(1); }
try{ const q=new URLSearchParams(location.search).get('server'); if(q){ let a=q.trim(); if(!/^https?:\/\//i.test(a)) a='http://'+a; SAVE.server=a.replace(/\/+$/,''); } }catch(e){}
if(!SAVE.pid){ SAVE.pid=Math.random().toString(36).slice(2,12)+Math.random().toString(36).slice(2,12); }
if(!SAVE.name){ SAVE.name='PLAYER'+(100+((Math.random()*900)|0)); SAVE.nameAuto=1; }
save();


// ---- direct play: WebRTC between two players, no server and no account (invite/reply codes) --------------------
const P2P={pc:null,dc:null,host:0,mine:{},remote:{},open:0};
const P2P_ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const b64=u8=>{ let t=''; for(let i=0;i<u8.length;i++) t+=String.fromCharCode(u8[i]); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const ub64=t=>{ t=t.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4) t+='='; const q=atob(t), u=new Uint8Array(q.length); for(let i=0;i<q.length;i++) u[i]=q.charCodeAt(i); return u; };
async function p2pPack(d){ const raw=new TextEncoder().encode(JSON.stringify({t:d.type,s:d.sdp}));
  try{ if(window.CompressionStream){ const cs=new CompressionStream('deflate-raw'), w=cs.writable.getWriter(); w.write(raw); w.close(); return 'Z'+b64(new Uint8Array(await new Response(cs.readable).arrayBuffer())); } }catch(e){}
  return 'R'+b64(raw); }
async function p2pUnpack(str){ str=String(str||'').replace(/\s+/g,''); const k=str[0], bin=ub64(str.slice(1)); let raw;
  if(k==='Z'){ const ds=new DecompressionStream('deflate-raw'), w=ds.writable.getWriter(); w.write(bin); w.close(); raw=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()); } else raw=new TextDecoder().decode(bin);
  const o=JSON.parse(raw); return {type:o.t,sdp:o.s}; }
function p2pGather(pc){ return new Promise(res=>{ if(pc.iceGatheringState==='complete') return res(); const t=setTimeout(res,4500); pc.addEventListener('icegatheringstatechange',()=>{ if(pc.iceGatheringState==='complete'){ clearTimeout(t); res(); } }); }); }
function p2pReset(){ try{ P2P.dc&&P2P.dc.close(); }catch(e){} try{ P2P.pc&&P2P.pc.close(); }catch(e){} P2P.pc=null; P2P.dc=null; P2P.mine={}; P2P.remote={}; P2P.open=0; }
function p2pAttach(dc){ P2P.dc=dc; dc.onopen=()=>{ P2P.open=1; try{ dc.send(JSON.stringify({p:P2P.mine})); }catch(e){} p2pConnected(); };
  dc.onmessage=ev=>{ try{ const m=JSON.parse(ev.data); if(m.p) Object.assign(P2P.remote,m.p); }catch(e){} };
  dc.onclose=()=>{ P2P.open=0; P2P.remote={}; }; }
const p2pRoomObj={p2p:1, join:async()=>({
  presence:async patch=>{ Object.assign(P2P.mine,patch); if(P2P.open){ try{ P2P.dc.send(JSON.stringify({p:patch})); }catch(e){} } },
  peers:()=>{ const o=[{peer:'me',isMe:true,sameTab:true,kind:'viewer',guest:false,by:null,presence:P2P.mine}]; if(P2P.open) o.push({peer:'opp',isMe:false,sameTab:false,kind:'viewer',guest:false,by:null,presence:P2P.remote}); return o; },
  leave:()=>{ p2pReset(); } }) };
async function p2pCreate(){ p2pReset(); P2P.host=1; const pc=P2P.pc=new RTCPeerConnection(P2P_ICE); p2pAttach(pc.createDataChannel('g')); await pc.setLocalDescription(await pc.createOffer()); await p2pGather(pc); return p2pPack(pc.localDescription); }
async function p2pAnswer(c){ const offer=await p2pUnpack(c); p2pReset(); P2P.host=0; const pc=P2P.pc=new RTCPeerConnection(P2P_ICE); pc.ondatachannel=e=>p2pAttach(e.channel); await pc.setRemoteDescription(offer); await pc.setLocalDescription(await pc.createAnswer()); await p2pGather(pc); return p2pPack(pc.localDescription); }
async function p2pFinish(c){ await P2P.pc.setRemoteDescription(await p2pUnpack(c)); }
function p2pConnected(){ if(net.ns||net.busy) return; net.room=p2pRoomObj; netJoin('DIRECT',P2P.host); }
function p2pCopy(el){ el.select(); try{ navigator.clipboard.writeText(el.value); }catch(e){ try{ document.execCommand('copy'); }catch(_){} } }
function p2pWire(){ const g=id=>document.getElementById(id); if(!g('lb-pc')) return;
  g('lb-pc').onclick=async()=>{ SFX.ok(); g('lb-pstep1').style.display='block'; g('lb-pout').value='MAKING INVITE...'; try{ g('lb-pout').value=await p2pCreate(); }catch(e){ g('lb-pout').value=''; net.err='DIRECT PLAY NOT SUPPORTED HERE'; lobbyState(); } };
  g('lb-pcopy').onclick=()=>p2pCopy(g('lb-pout')); g('lb-pcopy2').onclick=()=>p2pCopy(g('lb-pans'));
  g('lb-pconn').onclick=async()=>{ SFX.ok(); try{ await p2pFinish(g('lb-prep').value); net.err=''; net.status='CONNECTING...'; }catch(e){ net.err='THAT REPLY CODE LOOKS WRONG'; } lobbyState(); };
  g('lb-pj').onclick=async()=>{ SFX.ok(); g('lb-pstep2').style.display='block'; g('lb-pans').value='MAKING REPLY...'; try{ g('lb-pans').value=await p2pAnswer(g('lb-pin').value); net.err=''; net.status='SEND THE REPLY TO THE HOST'; }catch(e){ g('lb-pans').value=''; net.err='THAT INVITE CODE LOOKS WRONG'; } lobbyState(); };
  for(const id of ['lb-pin','lb-prep']) g(id).addEventListener('keydown',e=>e.stopPropagation()); }

lobbyInit(); p2pWire(); touchInit(); initGame(); lbInit();
</script>
